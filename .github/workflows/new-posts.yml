name: Build new posts
on:
  push:
    paths: ["new-posts/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build-new-posts.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add new-posts.json
          git diff --staged --quiet || git commit -m "Update new-posts.json"
          git push
