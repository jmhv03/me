<style>
  :root {
    --black: #000000;
    --panel: #0e0c07;
    --gold: #d4af37;
    --gold-dim: #6b5a24;
    --text: #efe3bd;
    --text-dim: #8c8068;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }

  html { min-height: 100%; background: var(--black); }
  body { min-height: 100vh; min-height: 100dvh; }
  body {
    font-family: "Martian Mono", "IBM Plex Mono", "Courier New", monospace;
    font-stretch: 75%;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 4.5rem 1.25rem 3rem;
    background-color: var(--black);
    background-image:
      radial-gradient(ellipse 55% 60% at 50% 38%, rgba(0,0,0,.75), transparent 75%),
      linear-gradient(rgba(212,175,55,.28) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,175,55,.28) 1px, transparent 1px),
      linear-gradient(rgba(212,175,55,.09) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,175,55,.09) 1px, transparent 1px);
    background-size: 100% 100%, 100px 100px, 100px 100px, 20px 20px, 20px 20px;
    background-position: center top, center -1px, -1px center, center -1px, -1px center;
    background-attachment: fixed;
  }

  main {
    width: 100%;
    max-width: 28rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .portrait {
    width: 8rem;
    height: 8rem;
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 5px;
    margin-bottom: 2rem;
  }
  .portrait img {
    width: 100%;
    height: 100%;
    border-radius: 9px;
    object-fit: cover;
    display: block;
  }

  h1 {
    font-weight: 700;
    font-stretch: 75%;
    font-size: clamp(1.9rem, 8.5vw, 2.6rem);
    line-height: 1.1;
    letter-spacing: -.01em;
    color: var(--gold);
    margin-bottom: .9rem;
  }
  .location {
    display: inline-flex;
    align-items: center;
    gap: .6rem;
    font-size: .85rem;
    font-stretch: 87.5%;
    color: var(--text);
    margin-bottom: 2.75rem;
  }
  .location .dot {
    position: relative;
    width: .55rem;
    height: .55rem;
    border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 6px #ff3b30;
  }
  .location .dot::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #ff3b30;
    animation: ping 1.6s ease-out infinite;
  }
  @keyframes ping {
    0%   { transform: scale(1); opacity: .8; }
    100% { transform: scale(3.2); opacity: 0; }
  }
  h1::after {
    content: "";
    display: inline-block;
    width: .5em;
    height: .9em;
    margin-left: .12em;
    vertical-align: -.08em;
    background: var(--gold);
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .links {
    list-style: none;
    padding: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: .75rem;
  }
  .links a {
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    padding: 1.1rem 1.25rem;
    border: 1px solid var(--gold);
    border-radius: 6px;
    background: var(--panel);
    color: var(--text);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    font-stretch: 87.5%;
    transition: background-color .15s ease, color .15s ease;
  }
  .links .icon { width: 1.5rem; height: 1.5rem; flex-shrink: 0; display: block; }
  .links .label { flex: 1; text-align: center; margin-right: 2.5rem; }
  .links a:hover { background: var(--gold); color: var(--black); }
  .links a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }


  /* Blueprint sketches */
  main { position: relative; z-index: 1; }
  .blueprint { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .sk {
    position: absolute;
    width: clamp(110px, 14vw, 190px);
    height: auto;
    overflow: visible;
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.3;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .75;
  }
  .sk-ski   { top: 4%;  left: 4%; }
  .sk-axe   { top: 50%; left: 4%;  transform: translateY(-50%); }
  .sk-bow   { bottom: 4%; left: 4%; }
  .sk-wind  { top: 4%;  right: 4%; }
  .sk-mouse { top: 50%; right: 5%; transform: translateY(-50%); }
  .sk-ball  { bottom: 5%; right: 5%; }
  .sk path { stroke-dasharray: 1; stroke-dashoffset: 0; }
  .sk .guide { stroke-width: .8; stroke-dasharray: .015 .015; opacity: .6; }
  .sk text {
    fill: var(--gold); stroke: none;
    font: 500 11px "Martian Mono", monospace; font-stretch: 75%;
  }
  .animate .sk path:not(.guide) { stroke-dashoffset: 1; }
  .animate .sk .guide, .animate .sk text { opacity: 0; }

  @media (max-width: 700px) {
    .sk { width: 110px; opacity: .4; }
    .sk-ski, .sk-wind { top: 2%; }
    .sk-bow, .sk-ball { bottom: 2%; }
    .sk-axe, .sk-mouse { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1::after, .location .dot::after { animation: none; }
    .links a { transition: none; }
  }
</style>
</head>

<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.documentElement.classList.add('animate');
  var STEP = 0.45, DRAW = 1.4, HOLD = 5, FADE = 1.5, GAP = 1;
  var starts = { 'sk-ski': 0, 'sk-wind': 1.5, 'sk-axe': 3, 'sk-mouse': 4.5, 'sk-bow': 6, 'sk-ball': 7.5 };
  document.querySelectorAll('.sk').forEach(function (svg) {
    var items = svg.querySelectorAll('path, text');
    function cycle() {
      svg.style.transition = 'none';
      svg.style.opacity = '';
      items.forEach(function (el) {
        el.style.transition = 'none';
        if (el.tagName === 'text' || el.classList.contains('guide')) el.style.opacity = 0;
        else el.style.strokeDashoffset = 1;
      });
      svg.getBoundingClientRect();
      items.forEach(function (el, i) {
        var d = i * STEP;
        if (el.tagName === 'text' || el.classList.contains('guide')) {
          el.style.transition = 'opacity .8s ease ' + d + 's';
          el.style.opacity = el.tagName === 'text' ? 1 : .6;
        } else {
          el.style.transition = 'stroke-dashoffset ' + DRAW + 's ease-in-out ' + d + 's';
          el.style.strokeDashoffset = 0;
        }
      });
      var drawn = (items.length - 1) * STEP + DRAW;
      setTimeout(function () {
        svg.style.transition = 'opacity ' + FADE + 's ease';
        svg.style.opacity = 0;
        setTimeout(cycle, (FADE + GAP) * 1000);
      }, (drawn + HOLD) * 1000);
    }
    var cls = Object.keys(starts).find(function (c) { return svg.classList.contains(c); });
    setTimeout(cycle, (starts[cls] || 0) * 1000);
  });
})();
</script>
